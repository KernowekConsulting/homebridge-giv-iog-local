name: Publish npm

on:
  push:
    tags: ['v4.2.0']

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/London
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Verify stable release
        run: |
          npm install --global npm@11.21.1
          test "$(node -p 'require("./package.json").version')" = "4.2.0"
          node tools/verify-observation-qualification.js
          npm ci --ignore-scripts
          npm test
          npm run test:hap
          npm audit --audit-level=low
      - name: Validate the packed release
        run: |
          npm pack --ignore-scripts
          mkdir verified-package
          tar -xzf homebridge-giv-iog-local-4.2.0.tgz -C verified-package
          ln -s "$PWD/node_modules" verified-package/package/node_modules
          cd verified-package/package
          node tools/verify-observation-qualification.js
          node tools/verify-release.js
          node tools/verify-release-notes.js
          npm run test:hap
      - name: Publish stable package with provenance
        run: npm publish homebridge-giv-iog-local-4.2.0.tgz --access public --tag latest --provenance
