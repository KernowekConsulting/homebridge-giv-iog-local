name: Publish npm

on:
  push:
    branches: ['release/v4.2.0-beta.2']
    tags: ['v4.2.0-beta.2']

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/London
    steps:
      - name: Checkout release
        uses: actions/checkout@v6
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Use validated npm
        run: |
          npm install --global npm@11.21.1
          test "$(npm --version)" = "11.21.1"
      - name: Verify scoped beta release
        run: |
          test "$(node -p 'require("./package.json").version')" = "4.2.0-beta.2"
          node tools/verify-observation-qualification.js --beta-publication
          npm ci --ignore-scripts
          npm test
          npm run test:hap
          npm audit --audit-level=low
      - name: Verify reviewed tarball
        run: |
          npm pack
          echo '85ffe43dc0b05ec7320e552270f87d4e6342ed67be4514530e50058dda9012f0  homebridge-giv-iog-local-4.2.0-beta.2.tgz' | sha256sum --check
      - name: Publish beta with trusted publishing
        if: startsWith(github.ref, 'refs/tags/')
        run: npm publish homebridge-giv-iog-local-4.2.0-beta.2.tgz --access public --tag beta --provenance
