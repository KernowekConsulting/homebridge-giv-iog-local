name: Publish npm

on:
  push:
    tags:
      - 'v4.1.3'

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release
        uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Use validated npm
        run: |
          npm install --global npm@11.21.1
          test "$(npm --version)" = "11.21.1"

      - name: Verify release
        run: |
          node tools/verify-observation-qualification.js
          test "$(node -p 'require("./package.json").version')" = "4.1.3"
          npm ci --ignore-scripts
          for file in index.js lib/*.js tools/*.js; do node --check "$file"; done
          npm test
          npm run test:hap
          npm audit --audit-level=low

      - name: Build and verify reviewed package
        run: |
          npm pack
          echo 'f9059523d80b6a91ecc3acaf2e8e5d22789cc0cbd6a252182f1f5c3eba4b90ac  homebridge-giv-iog-local-4.1.3.tgz' | sha256sum --check

      - name: Publish with trusted publishing
        run: npm publish homebridge-giv-iog-local-4.1.3.tgz --access public --tag latest
