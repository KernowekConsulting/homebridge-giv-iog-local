name: Publish npm

on:
  push:
    tags:
      - 'v4.1.2'

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release
        uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Use validated npm
        run: |
          npm install --global npm@11.21.1
          test "$(npm --version)" = "11.21.1"

      - name: Verify release
        run: |
          node tools/verify-observation-qualification.js
          test "$(node -p 'require("./package.json").version')" = "4.1.2"
          npm ci --ignore-scripts
          for file in index.js lib/*.js tools/*.js; do node --check "$file"; done
          npm test
          npm run test:hap
          npm audit --audit-level=low

      - name: Build and verify reviewed package
        run: |
          npm pack
          echo '7e819e767908f3de75c85e4c63919106b09296a9e73cebb03cb79f8fafb043ad  homebridge-giv-iog-local-4.1.2.tgz' | sha256sum --check

      - name: Publish with trusted publishing
        run: npm publish homebridge-giv-iog-local-4.1.2.tgz --access public --tag latest
